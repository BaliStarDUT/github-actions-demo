# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Go Build

on:
  push:
    branches: ["develop-go"]
  pull_request:
    branches: ["develop-go"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      name: build
      user_name: drawnkid
      
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go environment
        uses: actions/setup-go@v5.5.0
      - run: go version
      - run: bash build.sh
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: artifact-go-build-${{ env.name }}
          path: ${{ github.workspace }}/output
          if-no-files-found: warn
          retention-days: 5
      - name: Source to Image Build
        uses: redhat-actions/s2i-build@v2.4
        with:
          # The path of the s2i builder image.
          builder_image: centos/go-toolset-7-centos7
          # The Name of the image to build
          image: action-demo  
          
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.user_name }}
          password: ${{ secrets.DOCKER_PAT }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: "drawnkid/action-demo"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          tags: "${{ env.user_name }}/docker-build-cloud-demo:latest"
          # For pull requests, export results to the build cache.
          # Otherwise, push to a registry.
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || 'type=registry' }}
  
          
