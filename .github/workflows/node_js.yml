# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node_js CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      name: build
      user_name: drawnkid
      password: ${{ secrets.DOCKER_TOKEN }}

    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - run: npm test
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4.3.6
      with:
        name: index.js
        path: ./index.js
    - name: Source to Image Build
      uses: redhat-actions/s2i-build@v2.4
      with:
        # The path of the s2i builder image.
        builder_image: centos/nodejs-10-centos7
        # The Name of the image to build
        image: action-demo  
    - name: Login to GitLab
      uses: docker/login-action@v3
      with:
        registry: registry.gitlab.com
        username: ${{ vars.GITLAB_USERNAME }}
        password: ${{ secrets.GITLAB_PASSWORD }}    
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ env.user_name }}
        password: ${{ secrets.DOCKER_TOKEN }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: cloud
        endpoint: "drawnkid/action-demo"
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        tags: "${{ env.user_name }}/nodejs-web-server-demo:latest"
        # For pull requests, export results to the build cache.
        # Otherwise, push to a registry.
        outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || 'type=registry' }}

